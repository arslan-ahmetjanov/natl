# Local Ollama (offline / private) — OpenAI-compatible endpoint
# Start: ollama serve && ollama pull llama3.2
llm:
  provider: ollama
  endpoint: http://localhost:11434/v1
  # api_key optional for local
  model: llama3.2
  parameters:
    temperature: 0
    max_tokens: 2048
    top_p: 0.9
    seed: 42

mode: stdout
test_roots:
  - tests
  - examples
max_examples: 3
