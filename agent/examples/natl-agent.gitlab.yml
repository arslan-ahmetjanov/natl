# Comment on GitLab merge requests (or auto-detect in CI)
llm:
  provider: openai
  endpoint: https://api.openai.com/v1
  api_key: ${LLM_API_KEY}
  model: gpt-4o-mini
  parameters:
    temperature: 0
    max_tokens: 2048

mode: comment
comment_provider: gitlab   # or auto
test_roots:
  - tests
  - examples

# Optional overrides (usually filled from CI_* env in GitLab CI):
# gitlab_api_url: https://gitlab.com/api/v4
# gitlab_project_id: "123"
# gitlab_mr_iid: 45
