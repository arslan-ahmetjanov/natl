# Cloud OpenAI (or any OpenAI-compatible public API)
llm:
  provider: openai
  endpoint: https://api.openai.com/v1
  api_key: ${LLM_API_KEY}
  model: gpt-4o-mini
  parameters:
    temperature: 0
    max_tokens: 2048
    top_p: 0.9
    seed: 42

mode: comment
test_roots:
  - tests
  - examples
max_examples: 3
