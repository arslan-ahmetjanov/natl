# Custom OpenAI-compatible server (vLLM, NIM, LM Studio, LocalAI, …)
llm:
  provider: custom
  endpoint: http://127.0.0.1:8000/v1
  api_key: ${LLM_API_KEY}
  model: local-model
  parameters:
    temperature: 0
    max_tokens: 2048
    top_p: 0.9
    seed: 42

mode: stdout
test_roots:
  - tests
  - examples
