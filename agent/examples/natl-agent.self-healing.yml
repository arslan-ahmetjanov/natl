# Example: self-healing after validate fail
# Repair loop: invalid YAML → LLM (temperature 0) → re-validate, up to max_retries.
llm:
  provider: openai
  endpoint: https://api.openai.com/v1
  api_key: ${LLM_API_KEY}
  model: gpt-4o-mini
  parameters:
    temperature: 0
    max_tokens: 2048

mode: comment
test_roots:
  - tests
  - examples
max_examples: 3

self_healing:
  enabled: true
  max_retries: 2
