# Azure OpenAI (OpenAI-compatible deployment URL)
# endpoint example:
#   https://{resource}.openai.azure.com/openai/deployments/{deployment}
llm:
  provider: azure
  endpoint: ${AZURE_OPENAI_ENDPOINT}
  api_key: ${AZURE_OPENAI_API_KEY}
  api_version: "2024-08-01-preview"
  model: gpt-4o-mini
  parameters:
    temperature: 0
    max_tokens: 2048
    top_p: 0.9
    seed: 42

mode: comment
test_roots:
  - tests
  - examples
