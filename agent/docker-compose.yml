# Optional local stack: Ollama + agent (agent talks to host/network Ollama)
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Example one-shot (override command / mount your repo):
  # docker compose run --rm agent --config /work/natl-agent.yml --mode stdout
  agent:
    build: .
    network_mode: host
    environment:
      NATL_AGENT_PROVIDER: ollama
      OPENAI_BASE_URL: http://127.0.0.1:11434/v1
      OPENAI_MODEL: llama3.2
      NATL_AGENT_MODE: stdout
    volumes:
      - ../:/work
    working_dir: /work
    profiles: ["agent"]

volumes:
  ollama_data:
