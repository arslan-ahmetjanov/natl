name: NATL Agent
description: Generate NATL YAML tests from PR diffs using an OpenAI-compatible LLM
author: NATL

inputs:
  openai_api_key:
    description: API key (LLM_API_KEY / OPENAI_API_KEY). Optional for local Ollama.
    required: false
    default: ''
  openai_base_url:
    description: API base URL (e.g. https://api.openai.com/v1 or http://localhost:11434/v1)
    required: false
    default: https://api.openai.com/v1
  openai_model:
    description: Model id
    required: false
    default: gpt-4o-mini
  provider:
    description: openai | ollama | azure | custom
    required: false
    default: openai
  config:
    description: Path to natl-agent.yml (relative to repo root)
    required: false
    default: ''
  base_ref:
    description: Git base ref for diff
    required: false
    default: origin/main
  mode:
    description: comment | stdout | commit
    required: false
    default: comment
  test_roots:
    description: Comma-separated directories with existing NATL YAML for few-shot
    required: false
    default: tests,examples

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and build @natl/agent
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install --ignore-scripts
        npm run build

    - name: Fetch base ref
      shell: bash
      run: git fetch --no-tags --depth=1 origin "${{ inputs.base_ref }}" 2>/dev/null || true

    - name: Run NATL Agent
      shell: bash
      env:
        LLM_API_KEY: ${{ inputs.openai_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        OPENAI_BASE_URL: ${{ inputs.openai_base_url }}
        OPENAI_MODEL: ${{ inputs.openai_model }}
        NATL_AGENT_PROVIDER: ${{ inputs.provider }}
        NATL_AGENT_BASE_REF: ${{ inputs.base_ref }}
        NATL_AGENT_MODE: ${{ inputs.mode }}
        NATL_AGENT_TEST_ROOTS: ${{ inputs.test_roots }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        ARGS=(--provider "${{ inputs.provider }}" --base-url "${{ inputs.openai_base_url }}" --model "${{ inputs.openai_model }}")
        if [ -n "${{ inputs.config }}" ]; then
          ARGS+=(--config "${{ inputs.config }}")
        fi
        node "${{ github.action_path }}/dist/cli.js" "${ARGS[@]}"
