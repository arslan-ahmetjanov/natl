name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Peer @natl/core — for CI without npm publish, clone sibling or use file override.
      # When developing in the umbrella, prefer the root CI workflow.
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test
