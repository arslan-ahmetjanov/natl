name: Sandbox login smoke
tags: [smoke]
# engine / timeout / base_url come from natl.config.yaml
# Target: https://arslan-ahmetjanov.github.io/natl/sandbox.html

vars:
  user: demo@natl.dev
  pass: secret

steps:
  - goto: $base_url
  - wait: "#email visible"
  - fill: "#email"
    with: $user
  - fill: "#password"
    with: $pass
  - click: "#login-btn"
  - assert: ".welcome"
    text: "Welcome, demo"
  - click: "#ping-api"
  - wait: 1500 ms
  - assert: "#api-status"
    text: "ok"
  - log: "sandbox login + API ping passed"
