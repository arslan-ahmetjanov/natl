# Pre-release config — tiny Transformers.js server in local-llm/
llm:
  provider: custom
  endpoint: http://127.0.0.1:8787/v1
  model: onnx-community/Qwen2.5-0.5B-Instruct
  parameters:
    temperature: 0
    max_tokens: 1024
    top_p: 0.9
    seed: 42

mode: stdout
test_roots:
  - fixtures
  - ../../examples
max_examples: 2
base_ref: HEAD~1
