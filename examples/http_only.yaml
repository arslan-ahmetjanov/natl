name: HTTP only smoke
engine: http
timeout: 15000
tags:
  - smoke

vars:
  # Start first: node stubs/echo-server.mjs
  api_base: http://127.0.0.1:8765

steps:
  - get: $api_base/get
    save: ping
  - assert: $ping.status == 200
  - post: $api_base/post
    body: { hello: "natl" }
    save: echo
  - assert: $echo.status == 200
  - log: "http engine ok"
