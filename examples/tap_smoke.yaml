name: Tap alias smoke
engine: playwright
timeout: 10000
tags: [smoke]

vars:
  base_url: ./fixtures/sandbox.html

steps:
  - goto: $base_url
  - fill: "#email"
    with: demo@natl.dev
  - fill: "#password"
    with: secret
  - tap: "#login-btn"
  - assert: ".welcome"
    text: "Welcome, demo"
  - log: "tap alias OK"
