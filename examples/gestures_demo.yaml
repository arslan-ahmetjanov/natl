name: Web gestures demo
engine: playwright
timeout: 10000
tags:
  - smoke

vars:
  base_url: ./fixtures/gestures.html

steps:
  - goto: $base_url
  - scroll: "#footer"
    into_view: true
  - assert: "#footer"
    visible: true
  - swipe: "#carousel"
    direction: left
  - assert: "#swipe-status"
    contains: "left"
  - long_press: "#card"
    duration_ms: 700
  - assert: "#menu"
    visible: true
  - log: "gestures ok"
