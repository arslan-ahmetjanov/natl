name: UI + HTTP block
engine: playwright
timeout: 15000
tags:
  - smoke

imports:
  - pages/login.yaml

vars:
  base_url: ./fixtures/sandbox.html
  # Static JSON next to the live sandbox (network). Local stub still used by http_only.yaml.
  api_url: https://arslan-ahmetjanov.github.io/natl/sandbox-api.json
  test_user: mixed@natl.dev
  test_pass: secret

steps:
  - goto: $base_url
  - do: login.login
    user: $test_user
    pass: $test_pass
  - assert: ".welcome"
    text: "Welcome, mixed"

  - with: http
    steps:
      - get: $api_url
        save: ping
      - assert: $ping.status == 200
      - assert: $ping.body.ok == true

  - click: "#ping-api"
  - wait: 1500 ms
  - assert: "#api-status"
    text: "ok"

  - log: "UI + HTTP sandbox block ok"
