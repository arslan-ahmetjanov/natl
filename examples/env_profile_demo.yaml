# Uses vars.base_url from natl.config / env profile (no local vars.base_url).
# Default / --env staging → local fixture; --env prod → GitHub Pages sandbox.
name: Env profile demo
tags: [demo, env]
steps:
  - goto: $base_url
  - assert: "#email"
    visible: true
  - assert: "#login h1"
    text: "Login"
