name: Live sandbox smoke (Selenium)
engine: selenium
timeout: 30000
tags: [smoke, selenium, network]

steps:
  - goto: https://natl-dev.github.io/natl/sandbox.html
  - assert: "#login h1"
    text: "Login"
  - fill: "#email"
    with: demo@natl.dev
  - fill: "#password"
    with: secret
  - click: "#login-btn"
  - assert: ".welcome"
    text: "Welcome, demo"
  - log: "live sandbox ok via selenium"
