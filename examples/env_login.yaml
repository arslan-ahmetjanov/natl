name: Env sandbox login
engine: playwright
timeout: 10000
tags: [smoke, auth, env]

# Credentials from .env via unified $env / $secret (see .env.example).
secrets:
  env:
    file: .env.example

vars:
  base_url: ./fixtures/sandbox.html

steps:
  - goto: $base_url
  - fill: "#email"
    with: $env.TEST_USER
  - fill: "#password"
    with: $secret.TEST_PASS
  - click: "#login-btn"
  - assert: ".welcome"
    text: "Welcome, demo"
  - log: "Env login OK for $env.TEST_USER"
