# Example: suggest NATL tests on pull requests (OpenAI-compatible API)
name: NATL Agent
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  suggest-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./agent
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openai_base_url: ${{ vars.OPENAI_BASE_URL }}
          openai_model: ${{ vars.OPENAI_MODEL }}
          provider: openai
          config: '' # or path to natl-agent.yml in the consumer repo
          base_ref: origin/${{ github.base_ref }}
          mode: comment
          test_roots: tests,examples
