# Copy into your project as `.github/workflows/natl.yml`.
# Requires tests under `tests/` (e.g. after `natl init`).
#
# With `--reporter junit --reporter allure --output artifacts`:
#   artifacts/junit.xml
#   artifacts/allure-results/   (Allure 2 raw results)

name: NATL

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g @natl/cli @natl/adapter-playwright
      - run: npx playwright install --with-deps chromium
      - run: >
          natl run tests/
          --shard ${{ matrix.shard }}
          --reporter junit
          --reporter allure
          --output artifacts
        env:
          # Inject CI secrets as process env → $env.KEY / $secret.KEY (no Vault/AWS in NATL)
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: natl-artifacts-${{ strategy.job-index }}
          path: |
            artifacts/junit.xml
            artifacts/allure-results/

      # optional: HTML from Allure results (needs Allure CLI)
      # - run: npx allure generate artifacts/allure-results -o allure-report --clean
      #   if: always()
      # - uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: allure-report-${{ strategy.job-index }}
      #     path: allure-report/

      # optional: publish JUnit in the Checks tab
