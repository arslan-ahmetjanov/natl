name: POM sandbox login
engine: playwright
timeout: 10000

imports:
  - pages/login.yaml

vars:
  base_url: ./fixtures/sandbox.html
  test_user: pom@natl.dev
  test_pass: secret

steps:
  - goto: $base_url
  - do: login.login
    user: $test_user
    pass: $test_pass
  - assert: ".welcome"
    text: "Welcome, pom"
  - log: "POM login succeeded"
