name: Sandbox login
engine: playwright
timeout: 10000
tags: [smoke, auth]

vars:
  base_url: ./fixtures/sandbox.html
  user: demo@natl.dev
  pass: secret

steps:
  - goto: $base_url
  - fill: "#email"
    with: $user
  - fill: "#password"
    with: $pass
  - click: "#login-btn"
  - assert: ".welcome"
    text: "Welcome, demo"
  - log: "Login OK for $user"
