name: Вход в систему
engine: playwright
timeout: 10000
tags: [smoke, auth]

vars:
  base_url: ./fixtures/shop.html
  user: demo@test.com
  pass: secret

steps:
  - goto: $base_url
  - fill: "#email"
    with: $user
  - fill: "#password"
    with: $pass
  - click: "#login-btn"
  - assert: ".welcome"
    text: "Добро пожаловать"
  - log: "Login OK for $user"
