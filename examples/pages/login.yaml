name: LoginPage
url: /login
locator_strategy: css

elements:
  email_input: "#email"
  password_input: "#password"
  login_button: "#login-btn"
  error_message: ".error"
  # Escape hatch: per-element strategy (xpath) without changing step syntax
  login_heading:
    strategy: xpath
    value: "//h1[contains(., 'Login')]"

actions:
  login:
    - fill: $email_input
      with: $user
    - fill: $password_input
      with: $pass
    - click: $login_button

  check_error:
    - assert: $error_message
      visible: true
    - get_text: $error_message
      save: error_text
