name: Locator strategy demo
engine: playwright
timeout: 10000
tags:
  - smoke

imports:
  - pages/login.yaml

vars:
  base_url: ./fixtures/sandbox.html
  test_user: loc@natl.dev
  test_pass: secret

steps:
  - goto: $base_url
  - assert: $login_heading
    visible: true
  - do: login.login
    user: $test_user
    pass: $test_pass
  - assert: ".welcome"
    text: "Welcome, loc"
  - log: "locator strategy demo ok"
