name: Soft assert demo
engine: playwright
timeout: 10000

# Soft: prefer `assert` + `soft: true`. Alias `soft_assert:` still works.
# Soft asserts collect failures and continue; the run fails at the end with a summary.
# Hard assert would still stop immediately — commented out on purpose.
#
# Run: natl run examples/soft_assert_demo.yaml
# Optional screenshots: natl run examples/soft_assert_demo.yaml --soft-assert-screenshot

vars:
  base_url: file://./fixtures/shop.html

steps:
  - goto: $base_url
  - assert: ".welcome"
    text: "Wrong welcome"
    soft: true
  - assert: "#missing-stock"
    visible: true
    soft: true
  - soft_assert: "#login h1"
    text: "Login"
  - tap: "#login-btn"
  # - assert: ".welcome"
  #   text: "Would stop here"
