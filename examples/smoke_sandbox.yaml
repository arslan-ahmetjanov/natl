name: Live sandbox smoke
engine: playwright
timeout: 15000
tags: [smoke, network]

# Needs network — docs sandbox on GitHub Pages
steps:
  - goto: https://natl-dev.github.io/natl/sandbox.html
  - assert: "#login h1"
    text: "Login"
  - fill: "#email"
    with: demo@natl.dev
  - fill: "#password"
    with: secret
  - click: "#login-btn"
  - assert: ".welcome"
    text: "Welcome, demo"
  - click: "#ping-api"
  - wait: 1500 ms
  - assert: "#api-status"
    text: "ok"
  - log: "live sandbox ok"
