<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NATL Demo Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; }
    .error { color: #b00020; display: none; }
    .error.show { display: block; }
    .dashboard, .cart, .success-page { display: none; }
    .visible { display: block !important; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="login">
    <h1>Login</h1>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="login-btn" type="button">Login</button>
    <p class="error" id="error">Неверный пароль</p>
  </div>

  <div class="dashboard" id="dashboard">
    <h1 class="welcome">Добро пожаловать</h1>
    <input id="search" type="text" />
    <button id="search-btn" type="button">Search</button>
    <div class="product-list" id="product-list" style="display:none">
      <div class="product">
        <span class="product-name">Смартфон X</span>
        <button class="add-to-cart" type="button">Add</button>
      </div>
    </div>
    <a id="cart-link" href="#cart">Cart (<span class="cart-count">0</span>)</a>
  </div>

  <div class="cart" id="cart">
    <div class="cart-item">Смартфон X</div>
    <div class="total-price">120</div>
    <button id="checkout-btn" type="button">Checkout</button>
  </div>

  <div class="order-form" id="order-form" style="display:none">
    <input id="address" />
    <input id="phone" />
    <button id="submit-order" type="button">Submit</button>
  </div>

  <div class="success-page" id="success">
    <p>Order confirmed</p>
    <span class="order-number">ORD-1001</span>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const expectFail = params.get('fail') === '1';

    document.getElementById('login-btn').onclick = () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      if (expectFail || pass === 'wrong') {
        document.getElementById('error').classList.add('show');
        return;
      }
      document.getElementById('login').style.display = 'none';
      document.getElementById('dashboard').classList.add('visible');
      document.querySelector('.welcome').textContent =
        email.includes('user1') ? 'Добро пожаловать, User1' :
        email.includes('user2') ? 'Добро пожаловать, User2' :
        'Добро пожаловать';
    };

    document.getElementById('search-btn').onclick = () => {
      document.getElementById('product-list').style.display = 'block';
    };

    document.querySelector('.add-to-cart').onclick = () => {
      document.querySelector('.cart-count').textContent = '1';
    };

    document.getElementById('cart-link').onclick = (e) => {
      e.preventDefault();
      document.getElementById('dashboard').classList.remove('visible');
      document.getElementById('cart').classList.add('visible');
    };

    document.getElementById('checkout-btn').onclick = () => {
      document.getElementById('cart').classList.remove('visible');
      document.getElementById('order-form').style.display = 'block';
    };

    document.getElementById('submit-order').onclick = () => {
      document.getElementById('order-form').style.display = 'none';
      document.getElementById('success').classList.add('visible');
    };
  </script>
</body>
</html>
