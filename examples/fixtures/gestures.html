<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NATL Gestures Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    .spacer { height: 900px; background: linear-gradient(#f5f5f5, #ddd); padding: 1rem; }
    #footer { padding: 1rem; background: #222; color: #fff; }
    #carousel {
      display: flex; width: 240px; height: 80px; overflow: hidden;
      border: 1px solid #888; margin: 1rem; touch-action: none;
    }
    #carousel .track { display: flex; transition: transform 0.05s linear; }
    #carousel .slide { flex: 0 0 240px; height: 80px; display: flex; align-items: center; justify-content: center; }
    #carousel .slide:nth-child(1) { background: #cde; }
    #carousel .slide:nth-child(2) { background: #dec; }
    #card {
      width: 160px; height: 80px; margin: 1rem; background: #eef;
      border: 1px solid #99a; display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    #menu { display: none; margin: 1rem; padding: 0.5rem 1rem; background: #333; color: #fff; }
    #menu.show { display: inline-block; }
  </style>
</head>
<body>
  <div class="spacer">Scroll down to footer</div>
  <div id="footer">Footer reached</div>

  <div id="carousel">
    <div class="track" id="track">
      <div class="slide" data-i="0">Slide A</div>
      <div class="slide" data-i="1">Slide B</div>
    </div>
  </div>
  <p id="swipe-status">swipe: none</p>

  <div id="card">Long-press me</div>
  <div id="menu">Context menu</div>

  <script>
    let offset = 0;
    const track = document.getElementById('track');
    const status = document.getElementById('swipe-status');
    const carousel = document.getElementById('carousel');

    function applyOffset() {
      track.style.transform = `translateX(${offset}px)`;
      status.textContent = offset < -40 ? 'swipe: left' : offset > 40 ? 'swipe: right' : 'swipe: none';
    }

    let dragging = false;
    let startX = 0;
    let startOffset = 0;

    carousel.addEventListener('mousedown', (e) => {
      dragging = true;
      startX = e.clientX;
      startOffset = offset;
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      offset = startOffset + (e.clientX - startX);
      applyOffset();
    });
    window.addEventListener('mouseup', () => { dragging = false; });

    carousel.addEventListener('pointerdown', (e) => {
      dragging = true;
      startX = e.clientX;
      startOffset = offset;
      carousel.setPointerCapture(e.pointerId);
    });
    carousel.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      offset = startOffset + (e.clientX - startX);
      applyOffset();
    });
    carousel.addEventListener('pointerup', () => { dragging = false; });
    carousel.addEventListener('pointercancel', () => { dragging = false; });

    const card = document.getElementById('card');
    const menu = document.getElementById('menu');
    let pressTimer;
    function startPress() {
      pressTimer = setTimeout(() => menu.classList.add('show'), 500);
    }
    function endPress() { clearTimeout(pressTimer); }
    card.addEventListener('mousedown', startPress);
    card.addEventListener('mouseup', endPress);
    card.addEventListener('mouseleave', endPress);
    card.addEventListener('pointerdown', startPress);
    card.addEventListener('pointerup', endPress);
    card.addEventListener('pointerleave', endPress);
    card.addEventListener('pointercancel', endPress);
  </script>
</body>
</html>
