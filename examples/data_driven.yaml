name: Data-driven sandbox login
engine: playwright
timeout: 10000

vars:
  base_url: ./fixtures/sandbox.html

cases:
  - { name: user1, user: "user1@natl.dev", pass: "secret", expect: "Welcome, user1" }
  - { name: user2, user: "user2@natl.dev", pass: "secret", expect: "Welcome, user2" }

steps:
  - goto: $base_url
  - fill: "#email"
    with: $user
  - fill: "#password"
    with: $pass
  - click: "#login-btn"
  - assert: ".welcome"
    text: $expect
  - log: "Case OK: $user"
