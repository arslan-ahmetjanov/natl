name: Sandbox e2e (login + API + logout)
engine: playwright
timeout: 15000
tags: [regression, sandbox]

vars:
  base_url: ./fixtures/sandbox.html
  user_email: shopper@natl.dev
  user_pass: secret

steps:
  - goto: $base_url
  - fill: "#email"
    with: $user_email
  - fill: "#password"
    with: $user_pass
  - click: "#login-btn"
  - assert: ".welcome"
    text: "Welcome, shopper"

  - click: "#ping-api"
  - assert: "#api-status"
    text: "ok"

  - click: "#logout-btn"
  - assert: "#email"
    visible: true

  - fill: "#email"
    with: $user_email
  - fill: "#password"
    with: "wrong"
  - click: "#login-btn"
  - assert: "#error"
    visible: true

  - log: "Sandbox e2e complete"
  - screenshot: "screenshots/sandbox_e2e.png"
