# Copy to your repo root as `.gitlab-ci.yml`, or `include:` this file.
# Dry-run without tokens: set NATL_AGENT_MODE=stdout (default below for safety in shared runners).
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   LLM_API_KEY          — cloud LLM (optional if using Ollama service)
#   GITLAB_TOKEN         — Project Access Token / PAT with api scope (preferred over CI_JOB_TOKEN for MR notes)
#
# Prefill from the job environment:
#   CI_API_V4_URL, CI_PROJECT_ID, CI_MERGE_REQUEST_IID
#   CI_MERGE_REQUEST_DIFF_BASE_SHA / CI_MERGE_REQUEST_TARGET_BRANCH_NAME → diff base

stages:
  - suggest

natl-agent-mr:
  stage: suggest
  image: node:20-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # Use "comment" + GITLAB_TOKEN to post an MR note; "stdout" for dry-run logs only.
    NATL_AGENT_MODE: "stdout"
    NATL_AGENT_COMMENT_PROVIDER: "gitlab"
    NATL_AGENT_TEST_ROOTS: "tests,examples"
  before_script:
    - git fetch --unshallow 2>/dev/null || git fetch --all --depth=50 || true
    - npm install -g @natl/agent
  script:
    - |
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}}"
      natl-agent \
        --mode "${NATL_AGENT_MODE}" \
        --comment-provider "${NATL_AGENT_COMMENT_PROVIDER}" \
        --base "${BASE}" \
        --head HEAD \
        --provider "${NATL_AGENT_PROVIDER:-openai}" \
        --base-url "${OPENAI_BASE_URL:-https://api.openai.com/v1}" \
        --model "${OPENAI_MODEL:-gpt-4o-mini}"
  # To post on the MR: set NATL_AGENT_MODE=comment and GITLAB_TOKEN (masked).
  # CI_JOB_TOKEN is used as fallback when GITLAB_TOKEN is unset (permissions vary by GitLab version).
